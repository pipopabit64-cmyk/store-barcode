<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>店舗コード読取</title>

<script src="https://unpkg.com/@ericblade/quagga2/dist/quagga.min.js"></script>

<style>

body{
    margin:0;
    font-family:sans-serif;
    text-align:center;
}

#scanner{
    width:100%;
    height:70vh;
}

#result{
    font-size:28px;
    padding:20px;
}

button{
    font-size:24px;
    padding:12px 24px;
    margin-top:20px;
}

</style>

</head>

<body>

<div id="scanner"></div>

<div id="result">
読み取り待機中...
</div>

<script>

let stores = {};
let scanned = false;

fetch("./stores.json")
.then(r => r.json())
.then(data => {

    stores = data;

    startScanner();

});

function startScanner(){

    Quagga.init({

        inputStream:{
            type:"LiveStream",
            target:document.querySelector("#scanner"),
            constraints:{
                facingMode:"environment"
            }
        },

        decoder:{
            readers:[
                "code_128_reader",
                "code_39_reader"
            ]
        }

    }, function(err){

        if(err){

            console.error(err);

            document.getElementById("result")
                .innerText = "カメラ起動失敗";

            return;
        }

        Quagga.start();

    });

}

Quagga.onDetected(function(data){

    if(scanned) return;

    scanned = true;

    const barcode = data.codeResult.code;

    const storeCode = barcode.slice(0,7);

    const storeName =
        stores[storeCode] || "店舗不明";

    Quagga.stop();

    document.getElementById("result").innerHTML = `
        <div>
            <div>店舗名</div>
            <h2>${storeName}</h2>

            <div>読取値</div>
            <p>${barcode}</p>

            <button id="copyBtn">
                店舗名をコピー
            </button>
        </div>
    `;

    document.getElementById("copyBtn")
    .addEventListener("click", async () => {

        try {

            await navigator.clipboard.writeText(storeName);

            alert(
                storeName +
                " をコピーしました"
            );

        } catch(err){

            alert(
                "コピー失敗\n\n" +
                storeName
            );

            console.error(err);

        }

    });

});

</script>

</body>

</html>
