<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Code128 Reader</title>

<style>
body{
    font-family:sans-serif;
    text-align:center;
}

video{
    width:100%;
    max-width:600px;
}

#result{
    margin-top:20px;
    font-size:24px;
}
</style>

</head>

<body>

<h2>バーコード読取</h2>

<video id="video" playsinline></video>

<div id="result">
スキャン待機中...
</div>

<script type="module">

import {
 BrowserMultiFormatReader
}
from "https://cdn.jsdelivr.net/npm/@zxing/browser@latest/+esm";

const codeReader =
 new BrowserMultiFormatReader();

try{

 await codeReader.decodeFromVideoDevice(
  undefined,
  "video",

  (result,error)=>{

   if(result){

    document.getElementById("result")
      .innerHTML =
      result.getText();

   }

  });

}
catch(ex){

 document.getElementById("result")
   .innerHTML =
   ex.message;

}

</script>

</body>
</html>
