<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>クリップボード × DP袋 照合</title>
<script src="https://cdn.jsdelivr.net/npm/@ericblade/quagga2@1.8.4/dist/quagga.min.js"></script>
<style>
  body{ margin:0; font-family:sans-serif; -webkit-text-size-adjust:100%; color:#222; }
  .box{ padding:12px 14px; border-bottom:8px solid #f0f0f0; }
  h2{ font-size:16px; margin:0 0 10px; color:#555; }
  button{ font-size:18px; padding:14px; border:none; border-radius:8px; color:#fff; }
  .btn-main{ background:#06c; width:100%; }
  .btn-sub{ background:#999; }
  select{ font-size:18px; padding:10px; width:100%; box-sizing:border-box; }
  #target{ font-size:26px; font-weight:bold; margin:10px 0; }
  #status{ font-size:14px; color:#888; white-space:pre-wrap; }

  #verdict{ font-size:44px; font-weight:bold; text-align:center; padding:8px 0; color:#bbb; line-height:1.1; }
  #verdict.ok{ background:#0a0; color:#fff; }
  #verdict.ng{ background:#c00; color:#fff; }
  #verdict.pulse{ animation:pulse .35s ease-out; }
  @keyframes pulse{ 0%{ transform:scale(1.25);} 100%{ transform:scale(1);} }

  #scanner{ width:100%; height:42vh; background:#000; position:relative; overflow:hidden; }
  #scanner video, #scanner canvas{ width:100% !important; height:100% !important; object-fit:cover; }
  #guide{ position:absolute; left:8%; right:8%; top:35%; bottom:35%;
    border:3px solid rgba(255,255,255,.8); border-radius:8px; z-index:4; pointer-events:none; }
  #flash{ position:absolute; inset:0; background:#fff; opacity:0; z-index:5; pointer-events:none; }
  #flash.on{ opacity:.6; }

  #scanInfo{ font-size:16px; padding:8px 14px; color:#555; }
  #log{ list-style:none; margin:0; padding:0 14px 24px; }
  #log li{ display:flex; justify-content:space-between; padding:8px 4px; border-bottom:1px solid #eee; font-size:16px; }
  .tag-ok{ color:#0a0; font-weight:bold; }
  .tag-ng{ color:#c00; font-weight:bold; }
  .note{ font-size:13px; color:#999; }
</style>
</head>
<body>

<!-- STEP1: 対象店舗の設定 -->
<div class="box">
  <h2>① 対象店舗を設定</h2>
  <div id="target">対象店舗: 未設定</div>
  <div id="status"></div>
  <div style="margin-top:10px;">
    <span class="note">手動で選択：</span>
    <select id="manualSelect"><option value="">― 店舗を選択 ―</option></select>
  </div>
</div>

<!-- STEP2: 判定 + バーコードスキャン -->
<div class="box">
  <h2>② DP袋バーコードをスキャン</h2>
  <div id="verdict">―</div>
  <div id="scanner">
    <div id="guide"></div>
    <div id="flash"></div>
    <div id="overlay" style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#000;color:#fff;font-size:18px;z-index:10;">先に対象店舗を設定してください</div>
  </div>
  <div id="scanInfo">待機中</div>
  <button class="btn-sub" id="resetBtn" style="width:100%;margin-top:8px;">リセット（対象店舗を再設定）</button>
</div>

<ul id="log"></ul>

<script>
/* ===== 店リスト ===== */
const STORE_LIST = [
  "新宿西口本","新宿東口","吉祥寺","さいたま新都心駅前","上野","Akiba",
  "錦糸町","千葉","横浜","京急上大岡","川崎ルフロン","町田","八王子店",
  "新潟駅前","仙台","札幌","郡山","宇都宮","梅田","京都","博多","甲府","池袋"
];

const targetEl = document.getElementById("target");
const statusEl = document.getElementById("status");
const manual   = document.getElementById("manualSelect");
const verdict  = document.getElementById("verdict");
const overlay  = document.getElementById("overlay");
const flashEl  = document.getElementById("flash");
const scanInfo = document.getElementById("scanInfo");
const logEl    = document.getElementById("log");

let stores = {};
let targetStore = null;
let scannerStarted = false;
let scanned = false;
let lastCode = null, matchCount = 0;
const REQUIRED_MATCH = 2, MAX_ERROR = 0.18, COOLDOWN = 900;

STORE_LIST.forEach(s => { const o=document.createElement("option"); o.value=s; o.textContent=s; manual.appendChild(o); });

fetch("./stores.json")
  .then(r => { if(!r.ok) throw new Error("HTTP "+r.status); return r.json(); })
  .then(d => { stores = d; })
  .catch(e => console.log("stores.json読み込み失敗:", e));

/* ===== 音 ===== */
let audioCtx = null;
function unlockAudio(){
  try{
    audioCtx = audioCtx || new (window.AudioContext||window.webkitAudioContext)();
    if(audioCtx.state === "suspended") audioCtx.resume();
  }catch(e){}
}
document.addEventListener("touchend", unlockAudio);
document.addEventListener("click", unlockAudio);

function tone(freq, dur){
  unlockAudio(); if(!audioCtx) return;
  try{
    const o=audioCtx.createOscillator(), g=audioCtx.createGain();
    o.connect(g); g.connect(audioCtx.destination);
    o.type="square"; o.frequency.value=freq; g.gain.value=0.2;
    o.start(); o.stop(audioCtx.currentTime+dur);
  }catch(e){}
}
function flash(){ flashEl.classList.add("on"); setTimeout(()=>flashEl.classList.remove("on"),120); }
function pulse(){ verdict.classList.remove("pulse"); void verdict.offsetWidth; verdict.classList.add("pulse"); }
function feedbackOK(){ tone(1046,0.14); flash(); pulse(); if(navigator.vibrate) navigator.vibrate(120); }
function feedbackNG(){ tone(392,0.16); setTimeout(()=>tone(392,0.16),200); flash(); pulse(); if(navigator.vibrate) navigator.vibrate([120,90,120]); }

/* ===== STEP1: 店名照合（URLパラメータ・手動選択で使用） ===== */
/* 店名照合：完全包含 → あいまい一致（部分列一致率） */
function matchStore(rawText){
  const clean = rawText.replace(/\s/g,"");
  const exact = STORE_LIST.filter(s => clean.includes(s)).sort((a,b)=>b.length-a.length);
  if(exact.length) return exact[0];
  let best=null, bestScore=0;
  for(const s of STORE_LIST){
    let i=0, found=0;
    for(const ch of clean){ if(i<s.length && ch===s[i]){ i++; found++; } }
    const score = found / s.length;
    if(score > bestScore){ bestScore=score; best=s; }
  }
  return bestScore >= 0.7 ? best : null;
}

/* 手動選択 */
manual.addEventListener("change", () => { if(manual.value) setTarget(manual.value); });

function setTarget(name){
  targetStore = name;
  targetEl.textContent = "対象店舗: " + name;
  manual.value = name;
  overlay.style.display = "none";
  verdict.textContent = "―"; verdict.className = "";
  scanInfo.textContent = "DP袋バーコードを枠内に映してください";
  if(!scannerStarted) startScanner();
}

/* ===== STEP2: バーコード連続スキャン ===== */
function startScanner(){
  if(typeof Quagga === "undefined"){ scanInfo.textContent="スキャナー未読込（通信環境を確認）。"; return; }
  scannerStarted = true;
  Quagga.init({
    inputStream:{
      name:"Live", type:"LiveStream", target:document.querySelector("#scanner"),
      constraints:{ facingMode:"environment", width:{ideal:1280}, height:{ideal:720} },
      area:{ top:"35%", bottom:"35%", left:"8%", right:"8%" }
    },
    locator:{ patchSize:"medium", halfSample:true },
    numOfWorkers: navigator.hardwareConcurrency || 4,
    decoder:{ readers:[
      "codabar_reader",    // DP袋（NW-7）が主。下2行は予備。Codabarのみなら削除で更に高速化
      "code_128_reader",
      "code_39_reader"
    ]},
    locate:true
  }, function(err){
    if(err){ console.log(err); scanInfo.textContent="カメラを起動できません: " + (err.name||err.message||err); return; }
    const v=document.querySelector("#scanner video");
    if(v){ v.setAttribute("playsinline","true"); v.setAttribute("muted","true"); }
    Quagga.start();
  });
  Quagga.onDetected(onDetected);
}

function onDetected(data){
  if(scanned || !targetStore) return;
  const res = data.codeResult;
  const code = res && res.code;
  if(!code) return;

  const codes = res.decodedCodes || [];
  const errs = codes.map(c=>c.error).filter(e=>typeof e==="number");
  if(errs.length){ const avg=errs.reduce((a,b)=>a+b,0)/errs.length; if(avg>MAX_ERROR) return; }

  if(code===lastCode){ matchCount++; } else { lastCode=code; matchCount=1; return; }
  if(matchCount<REQUIRED_MATCH) return;

  const num = code.replace(/[^0-9]/g,"");
  const bagStore = stores[num.slice(0,7)] || "店舗不明";
  const isMatch = (bagStore === targetStore);

  if(isMatch){ verdict.textContent="OK"; verdict.className="ok pulse"; feedbackOK(); }
  else       { verdict.textContent="NG"; verdict.className="ng pulse"; feedbackNG(); }
  scanInfo.textContent = "DP袋: " + bagStore + " / " + num;
  addLog(num, bagStore, isMatch);

  scanned = true;
  setTimeout(() => { scanned=false; lastCode=null; matchCount=0; }, COOLDOWN);
}

function addLog(num, bagStore, isMatch){
  const li=document.createElement("li");
  const left=document.createElement("span"); left.textContent=bagStore+" / "+num;
  const tag=document.createElement("span"); tag.textContent=isMatch?"OK":"NG"; tag.className=isMatch?"tag-ok":"tag-ng";
  li.appendChild(left); li.appendChild(tag);
  logEl.insertBefore(li, logEl.firstChild);
}

document.getElementById("resetBtn").addEventListener("click", () => {
  targetStore=null; lastCode=null; matchCount=0; scanned=false;
  targetEl.textContent="対象店舗: 未設定"; manual.value="";
  verdict.textContent="―"; verdict.className="";
  overlay.style.display="flex"; scanInfo.textContent="待機中"; statusEl.textContent="";
});

/* ===== iOSショートカット等からURLパラメータで対象店舗を受け取る =====
   例: https://<ドメイン>/dp-verify.html?store=新宿西口本
   store でも text でも可。テキストを渡せば店リストと照合して判定する。 */
(function initFromURL(){
  const params = new URLSearchParams(location.search);
  const incoming = params.get("store") || params.get("text");
  if(!incoming) return;
  const store = matchStore(incoming);
  if(store){
    setTarget(store);
    statusEl.textContent = "ショートカットから「" + store + "」を受け取りました";
  }else{
    statusEl.textContent = "受け取ったテキストから店名を判定できませんでした。手動選択してください。\n[内容] " + incoming.replace(/\s+/g," ").slice(0,150);
  }
})();
</script>
</body>
</html>
