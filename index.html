<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>宅配伝票 × DP袋 照合</title>
<script src="https://cdn.jsdelivr.net/npm/@ericblade/quagga2@1.8.4/dist/quagga.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js"></script>
<style>
  body{ margin:0; font-family:sans-serif; -webkit-text-size-adjust:100%; color:#222; }
  .box{ padding:12px 14px; border-bottom:8px solid #f0f0f0; }
  h2{ font-size:16px; margin:0 0 10px; color:#555; }
  button{ font-size:18px; padding:14px; border:none; border-radius:8px; color:#fff; }
  .btn-main{ background:#06c; width:100%; }
  .btn-sub{ background:#999; }
  select{ font-size:18px; padding:10px; width:100%; box-sizing:border-box; }
  #target{ font-size:26px; font-weight:bold; margin:10px 0; }
  #ocrStatus{ font-size:14px; color:#888; white-space:pre-wrap; }

  /* 判定表示 */
  #verdict{
    font-size:60px; font-weight:bold; text-align:center;
    padding:24px 0; color:#999;
  }
  #verdict.ok{ background:#0a0; color:#fff; }
  #verdict.ng{ background:#c00; color:#fff; }

  #scanner{ width:100%; height:42vh; background:#000; position:relative; overflow:hidden; }
  #scanner video, #scanner canvas{ width:100% !important; height:100% !important; object-fit:cover; }

  #scanInfo{ font-size:16px; padding:8px 14px; color:#555; }
  #log{ list-style:none; margin:0; padding:0 14px 24px; }
  #log li{ display:flex; justify-content:space-between; padding:8px 4px; border-bottom:1px solid #eee; font-size:16px; }
  .tag-ok{ color:#0a0; font-weight:bold; }
  .tag-ng{ color:#c00; font-weight:bold; }
  .hidden{ display:none; }
  .note{ font-size:13px; color:#999; }
</style>
</head>
<body>

<!-- STEP1: 宅配伝票OCR -->
<div class="box">
  <h2>① 宅配伝票をスキャン（OCR）</h2>
  <button class="btn-main" id="ocrBtn">宅配伝票を撮影して店名を読み取る</button>
  <input type="file" id="ocrFile" accept="image/*" capture="environment" class="hidden">
  <div id="target">対象店舗: 未設定</div>
  <div id="ocrStatus"></div>
  <div style="margin-top:10px;">
    <span class="note">自動で取れない時は手動選択：</span>
    <select id="manualSelect"><option value="">― 店舗を選択 ―</option></select>
  </div>
</div>

<!-- STEP2: 判定 + バーコードスキャン -->
<div class="box" id="scanSection">
  <h2>② DP袋バーコードをスキャン</h2>
  <div id="verdict">―</div>
  <div id="scanner">
    <div id="overlay" style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#000;color:#fff;font-size:18px;z-index:10;">先に宅配伝票を読み取ってください</div>
  </div>
  <div id="scanInfo">待機中</div>
  <button class="btn-sub" id="resetBtn" style="width:100%;margin-top:8px;">新しい宅配伝票を読み取る（リセット）</button>
</div>

<ul id="log"></ul>

<script>
/* ===== 店リスト（OCR照合用） ===== */
const STORE_LIST = [
  "新宿西口本","新宿東口","吉祥寺","さいたま新都心駅前","上野","Akiba",
  "錦糸町","千葉","横浜","京急上大岡","川崎ルフロン","町田","八王子店",
  "新潟駅前","仙台","札幌","郡山","宇都宮","梅田","京都","博多","甲府","池袋"
];

/* ===== 要素 ===== */
const ocrBtn   = document.getElementById("ocrBtn");
const ocrFile  = document.getElementById("ocrFile");
const targetEl = document.getElementById("target");
const ocrStat  = document.getElementById("ocrStatus");
const manual   = document.getElementById("manualSelect");
const verdict  = document.getElementById("verdict");
const overlay  = document.getElementById("overlay");
const scanInfo = document.getElementById("scanInfo");
const logEl    = document.getElementById("log");

/* ===== 状態 ===== */
let stores = {};          // バーコードコード -> 店名 (stores.json)
let targetStore = null;   // 宅配伝票から特定した店名（変数）
let scannerStarted = false;
let scanned = false;      // クールダウン
let lastCode = null, matchCount = 0;
const REQUIRED_MATCH = 2, MAX_ERROR = 0.15, COOLDOWN = 1500;

/* 手動選択肢を生成 */
STORE_LIST.forEach(s => {
  const o = document.createElement("option");
  o.value = s; o.textContent = s; manual.appendChild(o);
});

/* stores.json（コード→店名）読み込み。失敗してもOCR/手動は使える */
fetch("./stores.json")
  .then(r => { if(!r.ok) throw new Error("HTTP "+r.status); return r.json(); })
  .then(d => { stores = d; })
  .catch(e => console.log("stores.json読み込み失敗:", e));

/* ===== 音 ===== */
let audioCtx = null;
function unlockAudio(){ try{ audioCtx = audioCtx || new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} }
function tone(freq, dur){
  if(!audioCtx) return;
  try{
    const o=audioCtx.createOscillator(), g=audioCtx.createGain();
    o.connect(g); g.connect(audioCtx.destination);
    o.frequency.value=freq; g.gain.value=0.15;
    o.start(); o.stop(audioCtx.currentTime+dur);
  }catch(e){}
}
function feedbackOK(){
  tone(1046, 0.15);                              // 高音1回
  if(navigator.vibrate) navigator.vibrate(120);  // 振動1回（Androidのみ）
}
function feedbackNG(){
  tone(440, 0.18); setTimeout(()=>tone(440,0.18), 220);   // 低音2回
  if(navigator.vibrate) navigator.vibrate([120,100,120]); // 振動2回（Androidのみ）
}

/* ===== STEP1: OCR ===== */
ocrBtn.addEventListener("click", () => { unlockAudio(); ocrFile.click(); });

ocrFile.addEventListener("change", async () => {
  const file = ocrFile.files[0];
  if(!file) return;
  if(typeof Tesseract === "undefined"){ ocrStat.textContent = "OCRライブラリ未読込（通信環境を確認）。手動選択を使ってください。"; return; }
  ocrStat.textContent = "認識中... (初回は言語データのDLで時間がかかります)";
  try{
    const worker = await getWorker();
    const { data } = await worker.recognize(file);
    const raw = data.text || "";
    const clean = raw.replace(/\s/g, "");
    // 店リストに含まれる店名を検出（複数該当時は最長一致を採用）
    const hits = STORE_LIST.filter(s => clean.includes(s)).sort((a,b)=>b.length-a.length);
    if(hits.length){
      setTarget(hits[0]);
      ocrStat.textContent = "認識結果から「" + hits[0] + "」を検出";
    }else{
      ocrStat.textContent = "店名を自動検出できませんでした。手動で選択してください。\n[OCR結果] " + raw.slice(0,120);
    }
  }catch(e){
    console.log(e);
    ocrStat.textContent = "OCRに失敗しました。手動で選択してください。";
  }finally{
    ocrFile.value = "";
  }
});

let ocrWorker = null;
async function getWorker(){
  if(ocrWorker) return ocrWorker;
  ocrWorker = await Tesseract.createWorker("jpn", 1, {
    logger: m => { if(m.status==="recognizing text") ocrStat.textContent = "認識中... " + Math.round(m.progress*100) + "%"; }
  });
  return ocrWorker;
}

/* 手動選択 */
manual.addEventListener("change", () => { if(manual.value) setTarget(manual.value); });

/* 対象店舗を確定 → バーコードスキャン開始 */
function setTarget(name){
  targetStore = name;
  targetEl.textContent = "対象店舗: " + name;
  overlay.style.display = "none";
  verdict.textContent = "―"; verdict.className = "";
  scanInfo.textContent = "DP袋を映してください";
  if(!scannerStarted) startScanner();
}

/* ===== STEP2: バーコード連続スキャン ===== */
function startScanner(){
  if(typeof Quagga === "undefined"){ scanInfo.textContent = "スキャナー未読込（通信環境を確認）。"; return; }
  scannerStarted = true;
  Quagga.init({
    inputStream:{ name:"Live", type:"LiveStream", target:document.querySelector("#scanner"),
      constraints:{ facingMode:"environment", width:{ideal:1280}, height:{ideal:720} } },
    locator:{ patchSize:"medium", halfSample:true },
    numOfWorkers: navigator.hardwareConcurrency || 2,
    frequency:10,
    decoder:{ readers:[
      "code_128_reader","code_39_reader","code_93_reader","ean_reader","ean_8_reader",
      "upc_reader","upc_e_reader","codabar_reader","i2of5_reader"
    ]},
    locate:true
  }, function(err){
    if(err){ console.log(err); scanInfo.textContent = "カメラを起動できません: " + (err.name||err.message||err); return; }
    const v = document.querySelector("#scanner video");
    if(v){ v.setAttribute("playsinline","true"); v.setAttribute("muted","true"); }
    Quagga.start();
  });
  Quagga.onDetected(onDetected);
}

function onDetected(data){
  if(scanned || !targetStore) return;
  const res = data.codeResult;
  const code = res && res.code;
  if(!code) return;

  // 誤差チェック
  const codes = res.decodedCodes || [];
  const errs = codes.map(c=>c.error).filter(e=>typeof e==="number");
  if(errs.length){ const avg = errs.reduce((a,b)=>a+b,0)/errs.length; if(avg>MAX_ERROR) return; }

  // 連続一致チェック
  if(code===lastCode){ matchCount++; } else { lastCode=code; matchCount=1; return; }
  if(matchCount<REQUIRED_MATCH) return;

  // 確定 → 照合
  const num = code.replace(/[^0-9]/g, "");
  const bagStore = stores[num.slice(0,7)] || "店舗不明";
  const isMatch = (bagStore === targetStore);

  if(isMatch){
    verdict.textContent = "OK"; verdict.className = "ok"; feedbackOK();
  }else{
    verdict.textContent = "NG"; verdict.className = "ng"; feedbackNG();
  }
  scanInfo.textContent = "DP袋: " + bagStore + " / " + num;
  addLog(num, bagStore, isMatch);

  scanned = true;
  setTimeout(() => { scanned=false; lastCode=null; matchCount=0; }, COOLDOWN);
}

function addLog(num, bagStore, isMatch){
  const li = document.createElement("li");
  const left = document.createElement("span");
  left.textContent = bagStore + " / " + num;
  const tag = document.createElement("span");
  tag.textContent = isMatch ? "OK" : "NG";
  tag.className = isMatch ? "tag-ok" : "tag-ng";
  li.appendChild(left); li.appendChild(tag);
  logEl.insertBefore(li, logEl.firstChild);
}

/* リセット（新しい宅配伝票へ） */
document.getElementById("resetBtn").addEventListener("click", () => {
  targetStore = null; lastCode=null; matchCount=0; scanned=false;
  targetEl.textContent = "対象店舗: 未設定";
  manual.value = "";
  verdict.textContent = "―"; verdict.className = "";
  overlay.style.display = "flex";
  scanInfo.textContent = "待機中";
  ocrStat.textContent = "";
});
</script>
</body>
</html>
