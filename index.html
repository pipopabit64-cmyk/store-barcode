<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>店舗コード読取</title>
<!-- バージョンを固定（最新指定だと読み込めない場合がある） -->
<script src="https://cdn.jsdelivr.net/npm/@ericblade/quagga2@1.8.4/dist/quagga.min.js"></script>
<style>
  body{ margin:0; font-family:sans-serif; }
  #scanner{
    width:100%;
    height:70vh;
    background:#000;
    position:relative;
    overflow:hidden;
  }
  /* Quaggaが挿入するvideo/canvasをコンテナに収める */
  #scanner video,
  #scanner canvas{
    width:100% !important;
    height:100% !important;
    object-fit:cover;
  }
  #result{
    font-size:32px;
    padding:20px;
  }
  .error{ color:#c00; font-size:20px; }
</style>
</head>
<body>
<div id="scanner"></div>
<div id="result">読み取り待機中...</div>

<script>
const resultEl = document.getElementById("result");

function showMsg(text, isError){
  resultEl.innerText = text;
  resultEl.className = isError ? "error" : "";
}

let stores = {};
let scanned = false;

// HTTPSチェック（カメラはhttpsかlocalhostでないと起動しない）
if(location.protocol !== "https:" && location.hostname !== "localhost"){
  showMsg("カメラはhttps接続でないと起動しません。\nhttpsのURLで開いてください。", true);
}

// Quaggaが読み込めているか確認
if(typeof Quagga === "undefined"){
  showMsg("スキャナーライブラリの読み込みに失敗しました（通信環境を確認）。", true);
}

// stores.json を読み込む。失敗してもスキャナーは起動させる
fetch("./stores.json")
  .then(r => {
    if(!r.ok) throw new Error("stores.json HTTP " + r.status);
    return r.json();
  })
  .then(data => { stores = data; })
  .catch(err => {
    console.log("stores.json読み込み失敗:", err);
    // 店舗名は不明になるが、スキャン自体は続行
  })
  .finally(() => {
    if(typeof Quagga !== "undefined"){
      startScanner();
    }
  });

function startScanner(){
  Quagga.init({
    inputStream:{
      name:"Live",
      type:"LiveStream",
      target: document.querySelector("#scanner"),
      constraints:{
        facingMode:"environment",
        width:{ ideal:1280 },
        height:{ ideal:720 }
      }
    },
    locator:{ patchSize:"medium", halfSample:true },
    numOfWorkers: navigator.hardwareConcurrency || 2,
    frequency:10,
    decoder:{
      readers:[
        "code_128_reader",   // CODE128
        "code_39_reader",    // CODE39
        "code_93_reader",    // CODE93
        "ean_reader",        // EAN-13 / JAN
        "ean_8_reader",      // EAN-8
        "upc_reader",        // UPC-A
        "upc_e_reader",      // UPC-E
        "codabar_reader",    // Codabar(NW-7)
        "i2of5_reader"       // Interleaved 2 of 5(ITF)
      ]
    },
    locate:true
  },
  function(err){
    if(err){
      console.log(err);
      // カメラ起動失敗の原因を画面に表示
      showMsg("カメラを起動できません: " + (err.name || err.message || err), true);
      return;
    }
    // iOS対策：videoにplaysinlineを付与
    const video = document.querySelector("#scanner video");
    if(video){
      video.setAttribute("playsinline", "true");
      video.setAttribute("muted", "true");
    }
    Quagga.start();
    showMsg("読み取り待機中...");
  });

  // onDetected は init成功後に登録（Quagga読み込み前の登録を避ける）
  Quagga.onDetected(onDetected);
}

// 連続一致チェック用
let lastCode = null;
let matchCount = 0;
const REQUIRED_MATCH = 2;   // 同じコードを連続2回読めたら確定
const MAX_ERROR = 0.15;     // デコード誤差の許容上限（小さいほど厳しい）

function onDetected(data){
  if(scanned) return;

  const result = data.codeResult;
  const barcode = result && result.code;
  if(!barcode) return;

  // 1) 読み取り誤差をチェック（ピンボケ・歪みの誤読を除外）
  const codes = result.decodedCodes || [];
  const errs = codes.map(c => c.error).filter(e => typeof e === "number");
  if(errs.length){
    const avgErr = errs.reduce((a, b) => a + b, 0) / errs.length;
    if(avgErr > MAX_ERROR) return;   // 信頼できないので無視
  }

  // 2) 連続一致チェック（一瞬の誤読を除外）
  if(barcode === lastCode){
    matchCount++;
  }else{
    lastCode = barcode;
    matchCount = 1;
    return;
  }
  if(matchCount < REQUIRED_MATCH) return;

  // ここで確定
  scanned = true;
  Quagga.offDetected(onDetected);
  Quagga.stop();

  // テキストデータ（バーコードの生の文字列）
  const raw = barcode;                        // 生の読み取り値（例: C153023200000C）
  const text = raw.replace(/[^0-9]/g, "");    // 数字だけ抽出（例: 153023200000）
  const storeCode = text.slice(0, 7);
  const storeName = stores[storeCode] || "店舗不明";

  showMsg(storeName + "\n" + text);

  setTimeout(() => {
    // ショートカットへ店舗名を渡す（生テキストを渡したい場合は storeName を text に変更）
    location.href =
      "shortcuts://run-shortcut?name=店舗受信&input=text&text="
      + encodeURIComponent(storeName);
  }, 1000);
}
</script>
</body>
</html>
