<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>宅配伝票 × DP袋 照合</title>
<script src="https://cdn.jsdelivr.net/npm/@ericblade/quagga2@1.8.4/dist/quagga.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<style>
  body{ margin:0; font-family:sans-serif; -webkit-text-size-adjust:100%; color:#222; line-height:1.2; }
  .box{ padding:10px 14px; border-bottom:6px solid #f0f0f0; }
  h2{ font-size:13px; margin:0 0 4px; color:#555; }
  button{ font-size:17px; padding:12px 14px; border:none; border-radius:8px; color:#fff; }
  .btn-main{ background:#06c; width:100%; }
  .btn-sub{ background:#999; }
  select{ font-size:17px; padding:8px; width:100%; box-sizing:border-box; }
  #target{ font-size:20px; font-weight:bold; margin:2px 0 6px; }
  #status{ font-size:13px; color:#888; white-space:pre-wrap; }

  #verdict{ font-size:38px; font-weight:bold; text-align:center; padding:6px 0; color:#bbb; line-height:1.1; }
  #verdict.ok{ background:#0a0; color:#fff; }
  #verdict.ng{ background:#c00; color:#fff; }
  #verdict.pulse{ animation:pulse .35s ease-out; }
  @keyframes pulse{ 0%{ transform:scale(1.25);} 100%{ transform:scale(1);} }

  #scanner{ width:100%; height:36vh; background:#000; position:relative; overflow:hidden; }
  #scanner video, #scanner canvas{ width:100% !important; height:100% !important; object-fit:cover; }
  #guide{ position:absolute; left:8%; right:8%; top:35%; bottom:35%;
    border:3px solid rgba(255,255,255,.8); border-radius:8px; z-index:4; pointer-events:none; }
  #flash{ position:absolute; inset:0; background:#fff; opacity:0; z-index:5; pointer-events:none; }
  #flash.on{ opacity:.6; }

  #scanInfo{ font-size:16px; padding:8px 14px; color:#555; }
  #log{ list-style:none; margin:0; padding:0 14px 24px; }
  #log li{ display:flex; justify-content:space-between; padding:8px 4px; border-bottom:1px solid #eee; font-size:16px; }
  .tag-ok{ color:#0a0; font-weight:bold; }
  .tag-ng{ color:#c00; font-weight:bold; }
  .note{ font-size:13px; color:#999; }
</style>
</head>
<body>

<!-- STEP1: 対象店舗の設定 -->
<div class="box">
  <h2>① 対象店舗を設定</h2>
  <div id="target">対象店舗: 未設定</div>
  <div id="status"></div>
  <div style="margin-top:8px;">
    <button class="btn-main" id="ocrBtn">📷 伝票を撮影して店舗を判定（OCR）</button>
    <input type="file" id="ocrInput" accept="image/*" capture="environment" style="display:none">
    <div id="ocrStatus" class="note" style="margin-top:6px; white-space:pre-wrap;"></div>
  </div>
  <div style="margin-top:8px;">
    <span class="note">手動で選択：</span>
    <select id="manualSelect"><option value="">― 店舗を選択 ―</option></select>
  </div>
</div>

<!-- STEP2: 判定 + バーコードスキャン -->
<div class="box">
  <h2>② DP袋バーコードをスキャン</h2>
  <div id="verdict">―</div>
  <div id="scanner">
    <div id="guide"></div>
    <div id="flash"></div>
    <div id="overlay" style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#000;color:#fff;font-size:18px;z-index:10;">先に対象店舗を設定してください</div>
  </div>
  <div id="scanInfo">待機中</div>
  <button class="btn-sub" id="resetBtn" style="width:100%;margin-top:8px;">リセット（対象店舗を再設定）</button>
</div>

<ul id="log"></ul>

<script>
/* ===== 店リスト ===== */
const STORE_LIST = [
  "新宿西口","新宿東口","吉祥寺","さいたま新都心駅前","上野","Akiba",
  "錦糸町","千葉","横浜","京急上大岡","川崎ルフロン","町田","八王子",
  "新潟駅前","仙台","札幌","郡山","宇都宮","梅田","京都","博多","甲府","池袋","サンシャインサカエ"
];

const targetEl = document.getElementById("target");
const statusEl = document.getElementById("status");
const manual   = document.getElementById("manualSelect");
const ocrBtn   = document.getElementById("ocrBtn");
const ocrInput = document.getElementById("ocrInput");
const ocrStat  = document.getElementById("ocrStatus");
const verdict  = document.getElementById("verdict");
const overlay  = document.getElementById("overlay");
const flashEl  = document.getElementById("flash");
const scanInfo = document.getElementById("scanInfo");
const logEl    = document.getElementById("log");

let stores = {};
let targetStore = null;
let scannerStarted = false;
let scanned = false;
let lastCode = null, matchCount = 0;
const REQUIRED_MATCH = 2, MAX_ERROR = 0.18, COOLDOWN = 900;

STORE_LIST.forEach(s => { const o=document.createElement("option"); o.value=s; o.textContent=s; manual.appendChild(o); });

fetch("./stores.json")
  .then(r => { if(!r.ok) throw new Error("HTTP "+r.status); return r.json(); })
  .then(d => { stores = d; })
  .catch(e => console.log("stores.json読み込み失敗:", e));

/* ===== 音 ===== */
let audioCtx = null;
function unlockAudio(){
  try{
    audioCtx = audioCtx || new (window.AudioContext||window.webkitAudioContext)();
    if(audioCtx.state === "suspended") audioCtx.resume();
  }catch(e){}
}
document.addEventListener("touchend", unlockAudio);
document.addEventListener("click", unlockAudio);

function tone(freq, dur){
  unlockAudio(); if(!audioCtx) return;
  try{
    const o=audioCtx.createOscillator(), g=audioCtx.createGain();
    o.connect(g); g.connect(audioCtx.destination);
    o.type="square"; o.frequency.value=freq; g.gain.value=0.2;
    o.start(); o.stop(audioCtx.currentTime+dur);
  }catch(e){}
}
function flash(){ flashEl.classList.add("on"); setTimeout(()=>flashEl.classList.remove("on"),120); }
function pulse(){ verdict.classList.remove("pulse"); void verdict.offsetWidth; verdict.classList.add("pulse"); }
function feedbackOK(){ tone(1046,0.14); flash(); pulse(); if(navigator.vibrate) navigator.vibrate(120); }
function feedbackNG(){ tone(392,0.16); setTimeout(()=>tone(392,0.16),200); flash(); pulse(); if(navigator.vibrate) navigator.vibrate([120,90,120]); }

/* ===== STEP1: 店名照合（URLパラメータ・手動選択で使用） ===== */
/* 店名照合：完全包含 → あいまい一致（部分列一致率） */
function matchStore(rawText){
  const clean = rawText.replace(/\s/g,"");
  const exact = STORE_LIST.filter(s => clean.includes(s)).sort((a,b)=>b.length-a.length);
  if(exact.length) return exact[0];
  let best=null, bestScore=0;
  for(const s of STORE_LIST){
    let i=0, found=0;
    for(const ch of clean){ if(i<s.length && ch===s[i]){ i++; found++; } }
    const score = found / s.length;
    if(score > bestScore){ bestScore=score; best=s; }
  }
  return bestScore >= 0.7 ? best : null;
}

/* ===== STEP1: OCR（伝票を撮影して日本語スキャン → 店名照合） ===== */
/* 認識しない語：住所による誤検出を防ぐ
   「東京都」→ 店名「京都」への誤マッチを防止
   「横浜市」→ 店名「横浜」への誤マッチを防止 */
const OCR_IGNORE = ["東京都", "横浜市"];

/* 照合対象の店名一覧（手動選択と同じ STORE_LIST に限定） */
function ocrStoreNames(){
  return [...new Set(STORE_LIST)].sort((a,b) => b.length - a.length); // 長い店名を優先
}

/* OCRテキストの正規化（空白・記号除去 → 無視語除去） */
function normalizeOCR(rawText){
  let t = (rawText || "")
    .replace(/[\s　]/g, "")        // 半角/全角スペース・改行
    .replace(/[^　-ヿ一-龯A-Za-z0-9]/g, ""); // OCRノイズ記号を除去
  OCR_IGNORE.forEach(w => { t = t.split(w).join(""); });
  return t;
}

/* 店名 s が text 内にどれだけ一致するか（同じ位置揃えで最も一致する窓のスコア 0〜1） */
function windowScore(text, s){
  if(text.length < s.length){
    let m = 0;
    for(let i = 0; i < text.length; i++) if(text[i] === s[i]) m++;
    return m / s.length;
  }
  let best = 0;
  for(let i = 0; i <= text.length - s.length; i++){
    let m = 0;
    for(let j = 0; j < s.length; j++) if(text[i + j] === s[j]) m++;
    const r = m / s.length;
    if(r > best){ best = r; if(best === 1) break; }
  }
  return best;
}

/* OCRテキストから店名を判定：①完全包含 → ②あいまい一致（誤読を許容） */
function matchStoreOCR(rawText){
  const t = normalizeOCR(rawText);
  const names = ocrStoreNames();

  // ① 完全に含まれていれば最優先（長い店名を優先）
  const exact = names.filter(n => t.includes(n));
  if(exact.length) return exact[0];

  // ② あいまい一致：誤読を1〜2文字許容。短い店名ほど厳しく（しきい値0.6）
  let best = null, bestScore = 0;
  for(const n of names){
    const sc = windowScore(t, n);
    if(sc > bestScore){ bestScore = sc; best = n; }
  }
  return bestScore >= 0.6 ? best : null;
}

ocrBtn.addEventListener("click", () => ocrInput.click());
ocrInput.addEventListener("change", () => {
  const f = ocrInput.files && ocrInput.files[0];
  ocrInput.value = ""; // 同じ画像を再選択できるようにクリア
  if(f) runOCR(f);
});

/* 画像前処理：拡大 → グレースケール → コントラスト伸張。
   薄いグレー文字を濃く引き伸ばし、高精度LSTMが読みやすい形にする */
async function preprocess(file){
  const img = await new Promise((res, rej) => {
    const im = new Image();
    im.onload = () => res(im);
    im.onerror = rej;
    im.src = URL.createObjectURL(file);
  });

  // 長辺を約2000pxに正規化（薄く小さい文字を拡大して解像度を確保）
  const target = 2000;
  const scale = target / Math.max(img.width, img.height);
  const w = Math.round(img.width * scale);
  const h = Math.round(img.height * scale);
  const cv = document.createElement("canvas");
  cv.width = w; cv.height = h;
  const ctx = cv.getContext("2d");
  ctx.imageSmoothingEnabled = true;
  ctx.imageSmoothingQuality = "high";
  ctx.drawImage(img, 0, 0, w, h);
  URL.revokeObjectURL(img.src);

  const imgData = ctx.getImageData(0, 0, w, h);
  const px = imgData.data;
  const total = w * h;

  // グレースケール化＋ヒストグラム作成（輝度）
  const hist = new Array(256).fill(0);
  const gray = new Uint8ClampedArray(total);
  for(let i = 0, p = 0; i < px.length; i += 4, p++){
    const g = (px[i] * 0.299 + px[i + 1] * 0.587 + px[i + 2] * 0.114) | 0;
    gray[p] = g; hist[g]++;
  }

  // 上下2%点を黒/白の基準にしてコントラストを伸張（グレア・退色に強い）
  const cut = total * 0.02;
  let acc = 0, lo = 0, hi = 255;
  for(let i = 0; i < 256; i++){ acc += hist[i]; if(acc >= cut){ lo = i; break; } }
  acc = 0;
  for(let i = 255; i >= 0; i--){ acc += hist[i]; if(acc >= cut){ hi = i; break; } }
  const range = Math.max(1, hi - lo);

  // ルックアップテーブルで伸張＋わずかにガンマを掛けて薄い文字を強調
  const lut = new Uint8ClampedArray(256);
  for(let i = 0; i < 256; i++){
    let v = (i - lo) / range;        // 0〜1に正規化
    v = Math.min(1, Math.max(0, v));
    v = Math.pow(v, 1.2);            // ガンマ>1で中間調を暗く＝薄文字を濃く
    lut[i] = (v * 255) | 0;
  }
  for(let i = 0, p = 0; i < px.length; i += 4, p++){
    const v = lut[gray[p]];
    px[i] = px[i + 1] = px[i + 2] = v; px[i + 3] = 255;
  }
  ctx.putImageData(imgData, 0, 0);
  return cv;
}

let ocrWorker = null;
async function getWorker(){
  if(ocrWorker) return ocrWorker;
  // 高精度モデル(tessdata_best) + LSTMエンジンで日本語精度を上げる
  ocrWorker = await Tesseract.createWorker("jpn", 1, {
    langPath: "https://tessdata.projectnaptha.com/4.0.0_best",
    gzip: true
  });
  await ocrWorker.setParameters({
    tessedit_pageseg_mode: "3",       // ページ自動解析（複数の行・領域が混在する伝票向け）
    preserve_interword_spaces: "1"
  });
  return ocrWorker;
}

async function runOCR(file){
  if(typeof Tesseract === "undefined"){ ocrStat.textContent = "OCR未読込（通信環境を確認してください）。"; return; }
  ocrBtn.disabled = true;
  ocrStat.textContent = "画像を解析中…（初回は日本語辞書のダウンロードに時間がかかります）";
  try{
    const canvas = await preprocess(file);
    const worker = await getWorker();
    const { data } = await worker.recognize(canvas);
    const text = (data && data.text) || "";
    const store = matchStoreOCR(text);
    if(store){
      setTarget(store);
      statusEl.textContent = "伝票OCRから「" + store + "」を受け取りました";
      ocrStat.textContent = "検出: " + store;
    }else{
      ocrStat.textContent = "店名を判定できませんでした。手動で選択してください。\n[読取] "
        + text.replace(/\s+/g, " ").trim().slice(0, 150);
    }
  }catch(e){
    ocrStat.textContent = "OCRに失敗しました: " + (e.message || e);
  }finally{
    ocrBtn.disabled = false;
  }
}

/* 手動選択 */
manual.addEventListener("change", () => { if(manual.value) setTarget(manual.value); });

function setTarget(name){
  targetStore = name;
  targetEl.textContent = "対象店舗: " + name;
  manual.value = name;
  overlay.style.display = "none";
  verdict.textContent = "―"; verdict.className = "";
  scanInfo.textContent = "DP袋バーコードを枠内に映してください";
  if(!scannerStarted) startScanner();
}

/* ===== STEP2: バーコード連続スキャン ===== */
function startScanner(){
  if(typeof Quagga === "undefined"){ scanInfo.textContent="スキャナー未読込（通信環境を確認）。"; return; }
  scannerStarted = true;
  Quagga.init({
    inputStream:{
      name:"Live", type:"LiveStream", target:document.querySelector("#scanner"),
      constraints:{ facingMode:"environment", width:{ideal:1280}, height:{ideal:720} },
      area:{ top:"35%", bottom:"35%", left:"8%", right:"8%" }
    },
    locator:{ patchSize:"medium", halfSample:true },
    numOfWorkers: navigator.hardwareConcurrency || 4,
    decoder:{ readers:[
      "codabar_reader",    // DP袋（NW-7）が主。下2行は予備。Codabarのみなら削除で更に高速化
      "code_128_reader",
      "code_39_reader"
    ]},
    locate:true
  }, function(err){
    if(err){ console.log(err); scanInfo.textContent="カメラを起動できません: " + (err.name||err.message||err); return; }
    const v=document.querySelector("#scanner video");
    if(v){ v.setAttribute("playsinline","true"); v.setAttribute("muted","true"); }
    Quagga.start();
  });
  Quagga.onDetected(onDetected);
}

function onDetected(data){
  if(scanned || !targetStore) return;
  const res = data.codeResult;
  const code = res && res.code;
  if(!code) return;

  const codes = res.decodedCodes || [];
  const errs = codes.map(c=>c.error).filter(e=>typeof e==="number");
  if(errs.length){ const avg=errs.reduce((a,b)=>a+b,0)/errs.length; if(avg>MAX_ERROR) return; }

  if(code===lastCode){ matchCount++; } else { lastCode=code; matchCount=1; return; }
  if(matchCount<REQUIRED_MATCH) return;

  const num = code.replace(/[^0-9]/g,"");
  const bagStore = stores[num.slice(0,7)] || "店舗不明";
  const isMatch = (bagStore === targetStore);

  if(isMatch){ verdict.textContent="OK"; verdict.className="ok pulse"; feedbackOK(); }
  else       { verdict.textContent="NG"; verdict.className="ng pulse"; feedbackNG(); }
  scanInfo.textContent = "DP袋: " + bagStore + " / " + num;
  addLog(num, bagStore, isMatch);

  scanned = true;
  setTimeout(() => { scanned=false; lastCode=null; matchCount=0; }, COOLDOWN);
}

function addLog(num, bagStore, isMatch){
  const li=document.createElement("li");
  const left=document.createElement("span"); left.textContent=bagStore+" / "+num;
  const tag=document.createElement("span"); tag.textContent=isMatch?"OK":"NG"; tag.className=isMatch?"tag-ok":"tag-ng";
  li.appendChild(left); li.appendChild(tag);
  logEl.insertBefore(li, logEl.firstChild);
}

document.getElementById("resetBtn").addEventListener("click", () => {
  targetStore=null; lastCode=null; matchCount=0; scanned=false;
  targetEl.textContent="対象店舗: 未設定"; manual.value="";
  verdict.textContent="―"; verdict.className="";
  overlay.style.display="flex"; scanInfo.textContent="待機中"; statusEl.textContent="";
});

/* ===== iOSショートカット等からURLパラメータで対象店舗を受け取る =====
   例: https://<ドメイン>/dp-verify.html?store=新宿西口
   store でも text でも可。テキストを渡せば店リストと照合して判定する。 */
(function initFromURL(){
  const params = new URLSearchParams(location.search);
  const incoming = params.get("store") || params.get("text");
  if(!incoming) return;
  const store = matchStore(incoming);
  if(store){
    setTarget(store);
    statusEl.textContent = "ショートカットから「" + store + "」を受け取りました";
  }else{
    statusEl.textContent = "受け取ったテキストから店名を判定できませんでした。手動選択してください。\n[内容] " + incoming.replace(/\s+/g," ").slice(0,150);
  }
})();
</script>
</body>
</html>
