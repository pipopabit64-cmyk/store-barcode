<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Barcode Test</title>
</head>

<body>

<video id="video" width="100%" playsinline></video>

<div id="result">
スキャン待機中...
</div>

<script type="module">

import {
  BrowserMultiFormatReader
}
from "https://cdn.jsdelivr.net/npm/@zxing/browser@0.1.5/+esm";

const reader =
  new BrowserMultiFormatReader();

reader.decodeFromVideoDevice(
  undefined,
  "video",
  (result, error) => {

    if(result){

      document.getElementById("result")
        .innerHTML =
        "読取成功<br>" +
        result.getText();

      reader.reset();

    }

  }
);

</script>

</body>
</html>
